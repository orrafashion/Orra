<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ORRA</title>
  <meta name="description" content="ORRA — Fashion Store">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* ================= HEADER ================= */

    header {
      height: 74px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 32px;
      letter-spacing: 7px;
      font-weight: normal;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .header-button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .cart {
      position: relative;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -9px;
      width: 16px;
      height: 16px;
      background: #111;
      color: #fff;
      border-radius: 50%;
      font-size: 9px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* ================= HERO ================= */

    .hero {
      position: relative;
      height: 78vh;
      min-height: 520px;
      overflow: hidden;
      background: #eee;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
    }

    .hero-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 55px;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.55),
        rgba(0,0,0,0)
      );
      color: #fff;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-label {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(48px, 7vw, 86px);
      font-weight: normal;
      line-height: .95;
      margin-bottom: 28px;
    }

    .shop-button {
      display: inline-block;
      background: #fff;
      color: #111;
      padding: 15px 25px;
      border: none;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* ================= SECTION ================= */

    .section {
      padding: 75px 5%;
    }

    .section-title {
      margin-bottom: 35px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 9px;
    }

    .section-title h2 {
      font-family: Georgia, serif;
      font-size: clamp(36px, 5vw, 58px);
      font-weight: normal;
    }

    /* ================= COLLECTIONS ================= */

    .collections {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .collection {
      position: relative;
      height: 470px;
      overflow: hidden;
      background: #eee;
    }

    .collection img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: transform .5s ease;
    }

    .collection:hover img {
      transform: scale(1.03);
    }

    .collection-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 22px;
      color: #fff;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.75)
      );
      font-family: Georgia, serif;
      font-size: 25px;
    }

    /* ================= PRODUCTS ================= */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      cursor: pointer;
    }

    .product-image {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #f1f1f1;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: transform .4s ease;
    }

    .product:hover img {
      transform: scale(1.03);
    }

    .product-info {
      padding: 14px 0 30px;
    }

    .product-name {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 12px;
      color: #666;
    }

    /* ================= EDITORIAL ================= */

    .editorial {
      margin: 20px 5% 75px;
      height: 500px;
      position: relative;
      overflow: hidden;
    }

    .editorial img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
    }

    .editorial-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.18);
      color: #fff;
      text-align: center;
    }

    .editorial-text h2 {
      font-family: Georgia, serif;
      font-size: clamp(45px, 7vw, 85px);
      font-weight: normal;
      letter-spacing: 5px;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #111;
      color: #fff;
      padding: 60px 5%;
      text-align: center;
    }

    .footer-logo {
      font-family: Georgia, serif;
      font-size: 34px;
      letter-spacing: 7px;
      margin-bottom: 20px;
    }

    .footer-text {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 30px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      header {
        height: 64px;
        padding: 0 18px;
      }

      .logo {
        font-size: 25px;
        letter-spacing: 5px;
      }

      .header-left,
      .header-right {
        gap: 15px;
      }

      .header-button {
        font-size: 18px;
      }

      .hero {
        height: 72vh;
        min-height: 500px;
      }

      .hero-content {
        padding: 25px;
        padding-bottom: 40px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero-label {
        font-size: 9px;
      }

      .section {
        padding: 55px 18px;
      }

      .section-title {
        margin-bottom: 25px;
      }

      .collections {
        gap: 9px;
      }

      .collection {
        height: 300px;
      }

      .collection-name {
        padding: 15px;
        font-size: 18px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-info {
        padding-bottom: 22px;
      }

      .product-name {
        font-size: 12px;
      }

      .product-price {
        font-size: 11px;
      }

      .editorial {
        margin: 10px 18px 55px;
        height: 400px;
      }

      .footer-links {
        flex-wrap: wrap;
        gap: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="header-left">
      <button class="header-button">☰</button>
    </div>

    <a href="#" class="logo">ORRA</a>

    <div class="header-right">

      <button class="header-button">⌕</button>

      <button class="header-button cart">
        ♡
        <span class="cart-count" id="cartCount">0</span>
      </button>

    </div>

  </header>


  <!-- HERO -->

  <section class="hero">

    <img
      src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1800&q=85"
      alt="ORRA Collection"
    >

    <div class="hero-content">

      <div class="hero-text">

        <div class="hero-label">
          NEW COLLECTION
        </div>

        <h1>
          Made for<br>
          your style.
        </h1>

        <a href="#shop" class="shop-button">
          Shop Now
        </a>

      </div>

    </div>

  </section>


  <!-- COLLECTIONS -->

  <section class="section">

    <div class="section-title">

      <div class="section-label">
        Explore
      </div>

      <h2>
        Collections
      </h2>

    </div>


    <div class="collections">

      <a href="#shop" class="collection">

        <img
          src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1000&q=85"

        >

        <div class="collection-name">
          New Arrivals
        </div>

      </a>


      <a href="#shop" class="collection">

        <img
          src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=1000&q=85"
          alt="Dresses"
        >

        <div class="collection-name">
          Dresses
        </div>

      </a>


      <a href="#shop" class="collection">

        <img
          src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=1000&q=85"

        >

        <div class="collection-name">
          Sets
        </div>

      </a>


      <a href="#shop" class="collection">

        <img
          src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=1000&q=85"
          alt="Tops"
        >

        <div class="collection-name">
          Tops
        </div>

      </a>

    </div>

  </section>


  <!-- EDITORIAL -->

  <div class="editorial">

    <img
      src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1800&q=85"
      alt="ORRA"
    >

    <div class="editorial-text">
      <h2>ORRA</h2>
    </div>

  </div>


  <!-- PRODUCTS -->

  <section class="section" id="shop">

    <div class="section-title">

      <div class="section-label">
        Shop
      </div>

      <h2>
        New In
      </h2>

    </div>


    <div class="products">

      <div class="product">

        <div class="product-image">

          <img

        </div>

        <div class="product-info">

          <div class="product-name">

          <div class="product-price">

        </div>

      </div>


      <div class="product">

        <div class="product-image">

          <img
            src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=900&q=85"
            alt="ORRA Dress"
          >

        </div>

        <div class="product-info">

          <div class="product-name">
            Essential Dress
          </div>

          <div class="product-price">
            $79
          </div>

        </div>

      </div>


      <div class="product">

        <div class="product-image">

          <img
            src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?auto=format&fit=crop&w=900&q=85"
            alt="ORRA Look"
          >

        </div>

        <div class="product-info">

          <div class="product-name">
            Evening Look
          </div>

          <div class="product-price">
            $110
          </div>

        </div>

      </div>


      <div class="product">

        <div class="product-image">

          <img
            src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
            alt="ORRA Set"
          >

        </div>

        <div class="product-info">

          <div class="product-name">
            Classic Set
          </div>

          <div class="product-price">
            $95
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-logo">
      ORRA
    </div>

    <div class="footer-text">
      Fashion made simple.
    </div>

    <div class="footer-links">

      <a href="#shop">Shop</a>

      <a href="#">About</a>

      <a href="#">Contact</a>

      <a href="#">Instagram</a>

    </div>

  </footer>

</body>
</html>
