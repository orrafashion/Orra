<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ORRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #eee;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      height: 72px;
      max-width: 1400px;
      margin: auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    nav {
      display: flex;
      gap: 30px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    nav a {
      transition: opacity .2s;
    }

    nav a:hover {
      opacity: .55;
    }

    .cart-button {
      border: 0;
      background: transparent;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* HERO */

    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #f2f2f2;
    }

    .hero img {
      width: 100%;
      height: 78vh;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0,0,0,.10);
    }

    .hero-content {
      color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
    }

    .hero-small {
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: clamp(40px, 8vw, 90px);
      font-weight: 500;
      letter-spacing: 8px;
      margin-bottom: 28px;
    }

    .hero-button {
      display: inline-block;
      background: #fff;
      color: #111;
      padding: 15px 30px;
      font-size: 12px;
      letter-spacing: 2px;
      border: 0;
    }

    /* SECTIONS */

    .section {
      max-width: 1400px;
      margin: auto;
      padding: 90px 28px;
    }

    .section-title {
      text-align: center;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 45px;
    }

    /* COLLECTIONS */

    .collections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .collection {
      position: relative;
      height: 500px;
      overflow: hidden;
      background: #eee;
    }

    .collection img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .collection:hover img {
      transform: scale(1.03);
    }

    .collection-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 28px;
      background: linear-gradient(
        transparent 45%,
        rgba(0,0,0,.5)
      );
    }

    .collection-name {
      color: white;
      font-size: 16px;
      letter-spacing: 3px;
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .product-card {
      cursor: pointer;
      background: white;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #f3f3f3;
    }

    .product-info {
      padding: 15px 2px 5px;
    }

    .product-category {
      font-size: 10px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 7px;
    }

    .product-name {
      font-size: 13px;
      margin-bottom: 7px;
    }

    .product-price {
      font-size: 13px;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* IMAGE BREAK */

    .image-break {
      height: 620px;
      position: relative;
      overflow: hidden;
      background: #eee;
    }

    .image-break img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* FOOTER */

    footer {
      background: #111;
      color: white;
      padding: 70px 28px 30px;
    }

    .footer-inner {
      max-width: 1400px;
      margin: auto;
    }

    .footer-logo {
      font-size: 28px;
      letter-spacing: 6px;
      margin-bottom: 45px;
    }

    .footer-links {
      display: flex;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 70px;
    }

    .footer-bottom {
      border-top: 1px solid #333;
      padding-top: 20px;
      font-size: 10px;
      color: #aaa;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(1050px, 100%);
      max-height: 94vh;
      overflow: auto;
      background: white;
      position: relative;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 18px;
      z-index: 20;
      width: 35px;
      height: 35px;
      border: 0;
      background: rgba(255,255,255,.9);
      font-size: 22px;
    }

    /* GALLERY */

    .gallery {
      position: relative;
      background: #f3f3f3;
      overflow: hidden;
    }

    .gallery-track {
      width: 100%;
      display: flex;
      transition: transform .3s ease;
      touch-action: pan-y;
    }

    .gallery-slide {
      min-width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
    }

    .gallery-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      background: rgba(255,255,255,.88);
      font-size: 18px;
      z-index: 10;
    }

    .gallery-prev {
      left: 12px;
    }

    .gallery-next {
      right: 12px;
    }

    .gallery-dots {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 7px;
      z-index: 10;
    }

    .gallery-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.55);
      padding: 0;
    }

    .gallery-dot.active {
      background: white;
    }

    /* PRODUCT DETAILS */

    .product-details {
      padding: 55px 45px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .detail-category {
      font-size: 10px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 12px;
    }

    .detail-name {
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .detail-price {
      font-size: 16px;
      margin-bottom: 30px;
    }

    .detail-description {
      font-size: 13px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 30px;
    }

    .size-label {
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .size-button {
      min-width: 48px;
      height: 42px;
      background: white;
      border: 1px solid #ddd;
      font-size: 12px;
    }

    .size-button.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .add-cart {
      width: 100%;
      height: 52px;
      background: #111;
      color: white;
      border: 0;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .header-inner {
        height: 64px;
        padding: 0 18px;
      }

      .logo {
        font-size: 21px;
        letter-spacing: 4px;
      }

      nav {
        display: none;
      }

      .hero,
      .hero img {
        height: 70vh;
        min-height: 520px;
      }

      .hero-title {
        font-size: 48px;
        letter-spacing: 5px;
      }

      .section {
        padding: 65px 18px;
      }

      .collections {
        grid-template-columns: 1fr;
      }

      .collection {
        height: 420px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .image-break {
        height: 450px;
      }

      .modal {
        padding: 0;
        align-items: flex-end;
      }

      .modal-box {
        width: 100%;
        max-height: 96vh;
        display: block;
        overflow-y: auto;
      }

      .gallery-slide {
        aspect-ratio: 4 / 5;
      }

      .product-details {
        padding: 30px 20px 35px;
      }

      .detail-name {
        font-size: 24px;
      }

      .close-modal {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="header-inner">

      <a href="#" class="logo">ORRA</a>

      <nav>
        <a href="#new-in">NEW IN</a>
        <a href="#collections">COLLECTIONS</a>
        <a href="#shop">SHOP</a>
      </nav>

      <button class="cart-button" onclick="showCart()">
        BAG (<span id="cartCount">0</span>)
      </button>

    </div>
  </header>


  <!-- HERO -->

  <section class="hero">

    <img
      src="IMG_3097.jpeg"
      alt="ORRA"
    >

    <div class="hero-overlay">

      <div class="hero-content">

        <div class="hero-small">
          NEW COLLECTION
        </div>

        <div class="hero-title">
          ORRA
        </div>

        <a href="#new-in" class="hero-button">
          SHOP NOW
        </a>

      </div>

    </div>

  </section>


  <!-- COLLECTIONS -->

  <section class="section" id="collections">

    <div class="section-title">
      COLLECTIONS
    </div>

    <div class="collections">

      <a href="#shop" class="collection">
        <img
          src="IMG_3097.jpeg"
          alt="Sets"
        >

        <div class="collection-overlay">
          <div class="collection-name">
            SETS
          </div>
        </div>
      </a>


      <a href="#shop" class="collection">
        <img
          src="IMG_3098.jpeg"
          alt="NEW IN"
        >

        <div class="collection-overlay">
          <div class="collection-name">
            NEW IN
          </div>
        </div>
      </a>


      <a href="#shop" class="collection">
        <img
          src="IMG_3099.jpeg"
          alt="ORRA"
        >

        <div class="collection-overlay">
          <div class="collection-name">
            SHOP ALL
          </div>
        </div>
      </a>

    </div>

  </section>


  <!-- NEW IN -->

  <section class="section" id="new-in">

    <div class="section-title">
      NEW IN
    </div>

    <div class="products" id="products">

      <div class="loading">

      </div>

    </div>

  </section>


  <!-- IMAGE BREAK -->

  <section class="image-break">

    <img
      src="IMG_3099.jpeg"
      alt="ORRA Collection"
    >

  </section>


  <!-- SHOP -->

  <section class="section" id="shop">

    <div class="section-title">
      SHOP ORRA
    </div>

    <div class="products" id="shopProducts">

      <div class="loading">
        LOADING PRODUCTS...
      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-inner">

      <div class="footer-logo">
        ORRA
      </div>

      <div class="footer-links">
        <a href="#new-in">NEW IN</a>
        <a href="#collections">COLLECTIONS</a>
        <a href="#shop">SHOP</a>
      </div>

      <div class="footer-bottom">
        © 2026 ORRA. ALL RIGHTS RESERVED.
      </div>

    </div>

  </footer>


  <!-- PRODUCT MODAL -->

  <div class="modal" id="productModal">

    <div class="modal-box">

      <button
        class="close-modal"
        onclick="closeProduct()"
      >
        ×
      </button>


      <!-- GALLERY -->

      <div class="gallery" id="gallery">

        <div
          class="gallery-track"
          id="galleryTrack"
        >
        </div>


        <button
          class="gallery-arrow gallery-prev"
          onclick="previousImage()"
        >
          ‹
        </button>


        <button
          class="gallery-arrow gallery-next"
          onclick="nextImage()"
        >
          ›
        </button>


        <div
          class="gallery-dots"
          id="galleryDots"
        >
        </div>

      </div>


      <!-- DETAILS -->

      <div class="product-details">

        <div
          class="detail-category"
          id="detailCategory"
        >
        </div>

        <h2
          class="detail-name"
          id="detailName"
        >
        </h2>

        <div
          class="detail-price"
          id="detailPrice"
        >
        </div>

        <div
          class="detail-description"
          id="detailDescription"
        >
        </div>


        <div class="size-label">
          SELECT SIZE
        </div>

        <div
          class="sizes"
          id="sizes"
        >
        </div>


        <button
          class="add-cart"
          onclick="addToCart()"
        >
          ADD TO BAG
        </button>

      </div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://zkgjtrpmonhnmtxtdjnf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_ojC9Dvnetb5aHKLTwCRo4Q_ce";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       VARIABLES
    ========================= */

    let products = [];

    let selectedProduct = null;

    let selectedSize = null;

    let currentImage = 0;

    let productImages = [];

    let cartCount = 0;


    /* =========================
       GET PRODUCT IMAGES
    ========================= */

    function getProductImages(product) {

      /*
        WHITE STITCH DETAIL SET
        This product has 3 photos.
      */

      if (
        product.name === "White Stitch Detail Set" ||
        (
          product.image_url &&
          product.image_url.includes("IMG_3097")
        )
      ) {

        return [
          "IMG_3097.jpeg",
          "IMG_3098.jpeg",
          "IMG_3099.jpeg"
        ];

      }


      /*
        FUTURE SUPPORT:
        If image_urls exists in Supabase,
        multiple images can be stored there.
      */

      if (
        product.image_urls &&
        typeof product.image_urls === "string"
      ) {

        return product.image_urls
          .split(",")
          .map(url => url.trim())
          .filter(Boolean);

      }


      /*
        NORMAL PRODUCT
      */

      if (product.image_url) {

        return [product.image_url];

      }


      return [];

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      const productsContainer =
        document.getElementById("products");

      const shopContainer =
        document.getElementById("shopProducts");


      productsContainer.innerHTML =
        '<div class="loading">LOADING PRODUCTS...</div>';

      shopContainer.innerHTML =
        '<div class="loading">LOADING PRODUCTS...</div>';


      const { data, error } =
        await supabaseClient
          .from("Products")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        productsContainer.innerHTML =
          '<div class="loading">COULD NOT LOAD PRODUCTS.</div>';

        shopContainer.innerHTML =
          '<div class="loading">COULD NOT LOAD PRODUCTS.</div>';

        return;
      }


      products = data || [];


      renderProducts(productsContainer, products);

      renderProducts(shopContainer, products);

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(container, productList) {

      if (!productList.length) {

        container.innerHTML =
          '<div class="loading">NO PRODUCTS YET.</div>';

        return;
      }


      container.innerHTML = "";


      productList.forEach(product => {

        const card =
          document.createElement("div");

        card.className =
          "product-card";


        const image =
          document.createElement("img");

        image.className =
          "product-image";

        image.src =
          getProductImages(product)[0] || "";

        image.alt =
          product.name || "ORRA";


        const info =
          document.createElement("div");

        info.className =
          "product-info";


        const category =
          document.createElement("div");

        category.className =
          "product-category";

        category.textContent =
          product.category || "ORRA";


        const name =
          document.createElement("div");

        name.className =
          "product-name";

        name.textContent =
          product.name || "Product";


        const price =
          document.createElement("div");

        price.className =
          "product-price";

        price.textContent =
          "$" + Number(product.price || 0).toFixed(2);


        info.appendChild(category);

        info.appendChild(name);

        info.appendChild(price);


        card.appendChild(image);

        card.appendChild(info);


        card.addEventListener(
          "click",
          function() {

            openProduct(product);

          }
        );


        container.appendChild(card);

      });

    }


    /* =========================
       OPEN PRODUCT
    ========================= */

    function openProduct(product) {

      selectedProduct =
        product;

      selectedSize =
        null;

      currentImage =
        0;


      productImages =
        getProductImages(product);


      document.getElementById(
        "detailCategory"
      ).textContent =
        product.category || "ORRA";


      document.getElementById(
        "detailName"
      ).textContent =
        product.name || "Product";


      document.getElementById(
        "detailPrice"
      ).textContent =
        "$" +
        Number(product.price || 0).toFixed(2);


      document.getElementById(
        "detailDescription"
      ).textContent =
        product.description ||
        "Designed by ORRA. Simple, modern and made for your style.";


      renderGallery();

      renderSizes();


      document.getElementById(
        "productModal"
      ).classList.add("active");


      document.body.style.overflow =
        "hidden";

    }


    /* =========================
       CLOSE PRODUCT
    ========================= */

    function closeProduct() {

      document.getElementById(
        "productModal"
      ).classList.remove("active");


      document.body.style.overflow =
        "";

    }


    /* =========================
       RENDER GALLERY
    ========================= */

    function renderGallery() {

      const track =
        document.getElementById(
          "galleryTrack"
        );

      const dots =
        document.getElementById(
          "galleryDots"
        );


      track.innerHTML = "";

      dots.innerHTML = "";


      if (!productImages.length) {

        return;

      }


      productImages.forEach(
        function(imageUrl, index) {

          const slide =
            document.createElement("div");

          slide.className =
            "gallery-slide";


          const image =
            document.createElement("img");

          image.src =
            imageUrl;

          image.alt =
            selectedProduct
              ? selectedProduct.name
              : "ORRA";


          slide.appendChild(image);

          track.appendChild(slide);


          const dot =
            document.createElement("button");

          dot.className =
            "gallery-dot";


          if (index === 0) {

            dot.classList.add(
              "active"
            );

          }


          dot.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

              currentImage =
                index;

              updateGallery();

            }
          );


          dots.appendChild(dot);

        }
      );


      updateGallery();

    }


    /* =========================
       UPDATE GALLERY
    ========================= */

    function updateGallery() {

      const track =
        document.getElementById(
          "galleryTrack"
        );


      track.style.transform =
        "translateX(-" +
        (currentImage * 100) +
        "%)";


      const dots =
        document.querySelectorAll(
          ".gallery-dot"
        );


      dots.forEach(
        function(dot, index) {

          dot.classList.toggle(
            "active",
            index === currentImage
          );

        }
      );

    }


    /* =========================
       NEXT IMAGE
    ========================= */

    function nextImage() {

      if (productImages.length <= 1) {

        return;

      }


      currentImage =
        (currentImage + 1) %
        productImages.length;


      updateGallery();

    }


    /* =========================
       PREVIOUS IMAGE
    ========================= */

    function previousImage() {

      if (productImages.length <= 1) {

        return;

      }


      currentImage =
        (currentImage - 1 +
          productImages.length) %
        productImages.length;


      updateGallery();

    }


    /* =========================
       SWIPE SUPPORT
    ========================= */

    let touchStartX = 0;

    let touchEndX = 0;


    const gallery =
      document.getElementById(
        "gallery"
      );


    gallery.addEventListener(
      "touchstart",
      function(event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );


    gallery.addEventListener(
      "touchend",
      function(event) {

        touchEndX =
          event.changedTouches[0].screenX;

        handleSwipe();

      },
      { passive: true }
    );


    function handleSwipe() {

      const difference =
        touchStartX - touchEndX;


      /*
        Ignore very small movements.
      */

      if (
        Math.abs(difference) < 40
      ) {

        return;

      }


      /*
        Swipe left = next image
      */

      if (difference > 0) {

        nextImage();

      }


      /*
        Swipe right = previous image
      */

      else {

        previousImage();

      }

    }


    /* =========================
       RENDER SIZES
    ========================= */

    function renderSizes() {

      const sizesContainer =
        document.getElementById(
          "sizes"
        );


      sizesContainer.innerHTML =
        "";


      let sizes = [];


      if (
        selectedProduct &&
        selectedProduct.sizes
      ) {

        sizes =
          selectedProduct.sizes
            .split(",")
            .map(size => size.trim())
            .filter(Boolean);

      }


      if (!sizes.length) {

        sizes = [
          "S",
          "M",
          "L"
        ];

      }


      sizes.forEach(
        function(size) {

          const button =
            document.createElement("button");


          button.className =
            "size-button";


          button.textContent =
            size;


          button.addEventListener(
            "click",
            function() {

              document
                .querySelectorAll(
                  ".size-button"
                )
                .forEach(
                  btn =>
                    btn.classList.remove(
                      "selected"
                    )
                );


              button.classList.add(
                "selected"
              );


              selectedSize =
                size;

            }
          );


          sizesContainer.appendChild(
            button
          );

        }
      );

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart() {

      if (!selectedProduct) {

        return;

      }


      if (!selectedSize) {

        alert(
          "Please select a size."
        );

        return;

      }


      cartCount++;


      document.getElementById(
        "cartCount"
      ).textContent =
        cartCount;


      alert(
        selectedProduct.name +
        " added to your bag."
      );

    }


    /* =========================
       CART
    ========================= */

    function showCart() {

      if (cartCount === 0) {

        alert(
          "Your bag is empty."
        );

        return;

      }


      alert(
        "You have " +
        cartCount +
        " item(s) in your bag."
      );

    }


    /* =========================
       CLOSE MODAL BY CLICKING
       OUTSIDE
    ========================= */

    document
      .getElementById("productModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target ===
            this
          ) {

            closeProduct();

          }

        }
      );


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          closeProduct();

        }


        if (
          event.key === "ArrowRight"
        ) {

          nextImage();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          previousImage();

        }

      }
    );


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>
