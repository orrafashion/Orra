<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ORRA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
 position:sticky;top:0;z-index:1000;
 background:rgba(255,255,255,.97);
 border-bottom:1px solid #eee;
 backdrop-filter:blur(10px)
}
.header{
 height:72px;max-width:1400px;margin:auto;padding:0 28px;
 display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:27px;font-weight:700;letter-spacing:5px}
.nav{display:flex;gap:30px;font-size:12px;letter-spacing:1.5px}
.nav a:hover{opacity:.5}
.header-actions{display:flex;align-items:center;gap:20px}
.icon-btn{
 border:0;background:none;color:#000;
 display:flex;align-items:center;gap:6px;
 font-size:12px;letter-spacing:1px
}
.icon-btn svg{width:20px;height:20px;stroke:#000;fill:none;stroke-width:1.8}

/* SEARCH */
.search-box{
 display:none;position:absolute;top:72px;left:0;right:0;
 background:#fff;border-bottom:1px solid #ddd;padding:18px 28px
}
.search-box.active{display:block}
.search-inner{max-width:1400px;margin:auto;display:flex;gap:10px}
.search-inner input{
 width:100%;border:0;border-bottom:1px solid #111;
 padding:12px 0;outline:none;font-size:14px
}

/* HERO */
.hero{height:78vh;min-height:520px;position:relative;overflow:hidden;background:#eee}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-overlay{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;text-align:center;background:rgba(0,0,0,.1)
}
.hero-content{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero-small{font-size:12px;letter-spacing:4px;margin-bottom:18px}
.hero-title{font-size:clamp(45px,8vw,90px);letter-spacing:8px;margin-bottom:28px}
.hero-button{
 display:inline-block;background:#fff;color:#111;padding:15px 30px;
 font-size:11px;letter-spacing:2px
}

/* SECTIONS */
.section{max-width:1400px;margin:auto;padding:90px 28px}
.section-title{text-align:center;font-size:11px;letter-spacing:4px;margin-bottom:45px}

/* COLLECTIONS */
.collections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.collection{height:500px;position:relative;overflow:hidden;background:#eee}
.collection img{width:100%;height:100%;object-fit:cover;transition:.5s}
.collection:hover img{transform:scale(1.03)}
.collection-overlay{
 position:absolute;inset:0;display:flex;align-items:flex-end;
 padding:28px;background:linear-gradient(transparent 45%,rgba(0,0,0,.5))
}
.collection-name{color:#fff;font-size:15px;letter-spacing:3px}

/* PRODUCTS */
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.product-card{cursor:pointer}
.product-image{
 width:100%;aspect-ratio:3/4;object-fit:cover;
 display:block;background:#f3f3f3
}
.product-info{padding:14px 2px 5px}
.product-category{font-size:9px;letter-spacing:2px;color:#777;margin-bottom:7px}
.product-name{font-size:13px;margin-bottom:7px}
.product-price{font-size:13px}
.loading{grid-column:1/-1;text-align:center;padding:60px;font-size:11px;letter-spacing:2px}

/* IMAGE BREAK */
.image-break{height:620px;overflow:hidden;background:#eee}
.image-break img{width:100%;height:100%;object-fit:cover}

/* FOOTER */
footer{background:#111;color:#fff;padding:70px 28px 30px}
.footer{max-width:1400px;margin:auto}
.footer-logo{font-size:28px;letter-spacing:6px;margin-bottom:45px}
.footer-links{display:flex;gap:30px;font-size:10px;letter-spacing:1px;margin-bottom:70px}
.footer-bottom{border-top:1px solid #333;padding-top:20px;font-size:9px;color:#aaa}

/* MODAL */
.modal{
 position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);
 display:none;align-items:center;justify-content:center;padding:20px
}
.modal.active{display:flex}
.modal-box{
 width:min(1050px,100%);max-height:94vh;overflow:auto;
 background:#fff;display:grid;grid-template-columns:1.1fr .9fr;
 position:relative
}
.close{
 position:absolute;right:15px;top:15px;z-index:20;
 width:38px;height:38px;border:0;background:#fff;color:#000;font-size:25px
}

/* GALLERY */
.gallery{position:relative;background:#f3f3f3;overflow:hidden}
.track{
 display:flex;width:100%;transition:transform .3s ease;
 touch-action:pan-y
}
.slide{min-width:100%;aspect-ratio:3/4}
.slide img{
 width:100%;height:100%;object-fit:cover;display:block;
 user-select:none;-webkit-user-drag:none
}
.arrow{
 position:absolute;top:50%;transform:translateY(-50%);
 width:42px;height:42px;border:1px solid #111;
 background:#fff;color:#000;z-index:10;
 font-size:25px;line-height:1
}
.prev{left:12px}.next{right:12px}
.dots{
 position:absolute;bottom:15px;left:0;right:0;
 display:flex;justify-content:center;gap:7px
}
.dot{
 width:7px;height:7px;border-radius:50%;
 border:1px solid #111;background:#fff;padding:0
}
.dot.active{background:#111}

/* DETAILS */
.details{padding:55px 45px;display:flex;flex-direction:column;justify-content:center}
.category{font-size:9px;letter-spacing:3px;color:#777;margin-bottom:12px}
.name{font-size:28px;font-weight:400;margin-bottom:12px}
.price{font-size:16px;margin-bottom:28px}
.description{font-size:13px;line-height:1.8;color:#555;margin-bottom:28px}
.size-label{font-size:9px;letter-spacing:2px;margin-bottom:10px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}
.size{
 min-width:48px;height:42px;background:#fff;
 border:1px solid #ddd;font-size:12px
}
.size.selected{background:#111;color:#fff;border-color:#111}
.add{
 width:100%;height:52px;background:#111;color:#fff;
 border:0;font-size:10px;letter-spacing:2px
}

/* BAG */
.bag-modal{
 position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.45);
 display:none;justify-content:flex-end
}
.bag-modal.active{display:flex}
.bag{
 background:#fff;width:min(450px,100%);height:100%;
 padding:28px;overflow:auto
}
.bag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.bag-title{font-size:12px;letter-spacing:3px}
.bag-close{border:0;background:none;font-size:24px;color:#000}
.bag-items{font-size:13px}
.bag-item{
 padding:15px 0;border-bottom:1px solid #eee;
 display:flex;justify-content:space-between;gap:10px
}
.checkout{
 margin-top:30px;width:100%;height:50px;
 background:#111;color:#fff;border:0;letter-spacing:2px;font-size:10px
}

/* MOBILE */
@media(max-width:800px){
 .header{height:64px;padding:0 18px}
 .logo{font-size:21px;letter-spacing:4px}
 .nav{display:none}
 .hero{height:70vh}
 .hero-title{font-size:48px;letter-spacing:5px}
 .section{padding:65px 18px}
 .collections{grid-template-columns:1fr}
 .collection{height:420px}
 .products{grid-template-columns:repeat(2,1fr);gap:15px}
 .image-break{height:450px}
 .modal{padding:0;align-items:flex-end}
 .modal-box{width:100%;max-height:96vh;display:block}
 .slide{aspect-ratio:4/5}
 .details{padding:30px 20px 35px}
 .name{font-size:24px}
 .close{top:10px;right:10px}
 .footer-links{flex-wrap:wrap}
}
</style>
</head>

<body>

<header>
 <div class="header">

  <a class="logo" href="#">ORRA</a>

  <nav class="nav">
   <a href="#new-in">NEW IN</a>
   <a href="#collections">COLLECTIONS</a>
   <a href="#shop">SHOP</a>
  </nav>

  <div class="header-actions">

   <!-- SEARCH -->
   <button class="icon-btn" onclick="toggleSearch()">
    <svg viewBox="0 0 24 24">
     <circle cx="11" cy="11" r="6.5"></circle>
     <path d="M16 16l5 5"></path>
    </svg>
    <span>SEARCH</span>
   </button>

   <!-- BAG -->
   <button class="icon-btn" onclick="openBag()">
    <svg viewBox="0 0 24 24">
     <path d="M6 8h12l1 13H5L6 8z"></path>
     <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
    </svg>
    <span>BAG (<b id="bagCount">0</b>)</span>
   </button>

  </div>
 </div>

 <div class="search-box" id="searchBox">
  <div class="search-inner">
   <input id="searchInput" placeholder="Search ORRA..." oninput="searchProducts()">
  </div>
 </div>
</header>


<!-- HERO -->
<section class="hero">
 <img src="IMG_3097.jpeg" alt="ORRA">
 <div class="hero-overlay">
  <div class="hero-content">
   <div class="hero-small">NEW COLLECTION</div>
   <div class="hero-title">ORRA</div>
   <a href="#new-in" class="hero-button">SHOP NOW</a>
  </div>
 </div>
</section>


<!-- COLLECTIONS -->
<section class="section" id="collections">
 <div class="section-title">COLLECTIONS</div>

 <div class="collections">

  <a class="collection" href="#shop">
   <img src="IMG_3097.jpeg" alt="SETS">
   <div class="collection-overlay">
    <div class="collection-name">SETS</div>
   </div>
  </a>

  <a class="collection" href="#new-in">
   <img src="IMG_3098.jpeg" alt="NEW IN">
   <div class="collection-overlay">
    <div class="collection-name">NEW IN</div>
   </div>
  </a>

  <a class="collection" href="#shop">
   <img src="IMG_3099.jpeg" alt="SHOP ALL">
   <div class="collection-overlay">
    <div class="collection-name">SHOP ALL</div>
   </div>
  </a>

 </div>
</section>


<!-- NEW IN -->
<section class="section" id="new-in">
 <div class="section-title">NEW IN</div>
 <div class="products" id="newProducts">
  <div class="loading">LOADING PRODUCTS...</div>
 </div>
</section>


<section class="image-break">
 <img src="IMG_3099.jpeg" alt="ORRA">
</section>


<!-- SHOP -->
<section class="section" id="shop">
 <div class="section-title">SHOP ORRA</div>
 <div class="products" id="shopProducts">
  <div class="loading">LOADING PRODUCTS...</div>
 </div>
</section>


<footer>
 <div class="footer">
  <div class="footer-logo">ORRA</div>

  <div class="footer-links">
   <a href="#new-in">NEW IN</a>
   <a href="#collections">COLLECTIONS</a>
   <a href="#shop">SHOP</a>
  </div>

  <div class="footer-bottom">
   © 2026 ORRA. ALL RIGHTS RESERVED.
  </div>
 </div>
</footer>


<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">

 <div class="modal-box">

  <button class="close" onclick="closeProduct()">×</button>

  <div class="gallery" id="gallery">

   <div class="track" id="track"></div>

   <button class="arrow prev" onclick="previousImage()">‹</button>
   <button class="arrow next" onclick="nextImage()">›</button>

   <div class="dots" id="dots"></div>

  </div>


  <div class="details">

   <div class="category" id="detailCategory"></div>

   <div class="name" id="detailName"></div>

   <div class="price" id="detailPrice"></div>

   <div class="description" id="detailDescription"></div>

   <div class="size-label">SELECT SIZE</div>

   <div class="sizes" id="sizes"></div>

   <button class="add" onclick="addToBag()">ADD TO BAG</button>

  </div>

 </div>
</div>


<!-- BAG -->
<div class="bag-modal" id="bagModal">

 <div class="bag">

  <div class="bag-head">
   <div class="bag-title">YOUR BAG</div>
   <button class="bag-close" onclick="closeBag()">×</button>
  </div>

  <div class="bag-items" id="bagItems">
   Your bag is empty.
  </div>

  <button class="checkout" onclick="checkout()">
   CHECKOUT
  </button>

 </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zkgjtrpmonhnmtxtdjnf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ojC9Dvnetb5aHKLTwCRo4Q_ce";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


let products=[];
let selectedProduct=null;
let selectedSize=null;
let images=[];
let currentImage=0;

let bag=[];


/* =========================
   PRODUCT IMAGES
========================= */

function getImages(product){

 /*
  Current White Stitch product.
 */

 if(
  product.name === "White Stitch Detail Set" ||
  String(product.image_url || "").includes("IMG_3097")
 ){
  return[
   "IMG_3097.jpeg",
   "IMG_3098.jpeg",
   "IMG_3099.jpeg"
  ];
 }


 /*
  Future multiple-image support.
  If image_urls exists, separate URLs
  with commas.
 */

 if(
  product.image_urls &&
  typeof product.image_urls === "string"
 ){
  return product.image_urls
   .split(",")
   .map(x=>x.trim())
   .filter(Boolean);
 }


 if(product.image_url){
  return[product.image_url];
 }

 return[];
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

 const newBox=document.getElementById("newProducts");
 const shopBox=document.getElementById("shopProducts");

 newBox.innerHTML='<div class="loading">LOADING PRODUCTS...</div>';
 shopBox.innerHTML='<div class="loading">LOADING PRODUCTS...</div>';


 let result=
 await supabaseClient
 .from("Products")
 .select("*")
 .order("created_at",{ascending:false});


 /*
  If "Products" fails because the database
  table was created lowercase, try "products".
 */

 if(result.error){

  result=
  await supabaseClient
  .from("products")
  .select("*")
  .order("created_at",{ascending:false});

 }


 if(result.error){

  console.error("Supabase error:",result.error);

  /*
   Keep the website working even if the
   database is temporarily unavailable.
  */

  products=[
   {
    id:1,
    name:"White Stitch Detail Set",
    price:35,
    category:"SETS",
    image_url:"IMG_3097.jpeg",
    sizes:"S,M,L"
   }
  ];

 }else{

  products=result.data || [];

 }


 renderProducts(products,newBox);
 renderProducts(products,shopBox);

}


/* =========================
   RENDER
========================= */

function renderProducts(list,box){

 if(!list.length){

  box.innerHTML=
  '<div class="loading">NO PRODUCTS YET.</div>';

  return;
 }


 box.innerHTML="";


 list.forEach(product=>{

  const card=document.createElement("div");
  card.className="product-card";

  const image=document.createElement("img");
  image.className="product-image";

  const productImages=getImages(product);

  image.src=productImages[0] || "";
  image.alt=product.name || "ORRA";


  const info=document.createElement("div");
  info.className="product-info";


  const category=document.createElement("div");
  category.className="product-category";
  category.textContent=product.category || "ORRA";


  const name=document.createElement("div");
  name.className="product-name";
  name.textContent=product.name || "Product";


  const price=document.createElement("div");
  price.className="product-price";
  price.textContent="$"+Number(product.price || 0).toFixed(2);


  info.appendChild(category);
  info.appendChild(name);
  info.appendChild(price);

  card.appendChild(image);
  card.appendChild(info);


  card.onclick=()=>openProduct(product);

  box.appendChild(card);

 });

}


/* =========================
   OPEN PRODUCT
========================= */

function openProduct(product){

 selectedProduct=product;
 selectedSize=null;
 currentImage=0;

 images=getImages(product);


 document.getElementById("detailCategory").textContent=
 product.category || "ORRA";

 document.getElementById("detailName").textContent=
 product.name || "Product";

 document.getElementById("detailPrice").textContent=
 "$"+Number(product.price || 0).toFixed(2);

 document.getElementById("detailDescription").textContent=
 product.description ||
 "Designed by ORRA. Simple, modern and made for your style.";


 renderGallery();
 renderSizes();

 document.getElementById("productModal").classList.add("active");

 document.body.style.overflow="hidden";
}


/* =========================
   CLOSE
========================= */

function closeProduct(){

 document.getElementById("productModal").classList.remove("active");

 document.body.style.overflow="";
}


/* =========================
   GALLERY
========================= */

function renderGallery(){

 const track=document.getElementById("track");
 const dots=document.getElementById("dots");

 track.innerHTML="";
 dots.innerHTML="";


 images.forEach((url,index)=>{

  const slide=document.createElement("div");
  slide.className="slide";

  const img=document.createElement("img");
  img.src=url;
  img.alt=selectedProduct?.name || "ORRA";

  slide.appendChild(img);
  track.appendChild(slide);


  const dot=document.createElement("button");
  dot.className="dot";

  if(index===0)dot.classList.add("active");

  dot.onclick=()=>{
   currentImage=index;
   updateGallery();
  };

  dots.appendChild(dot);

 });


 updateGallery();
}


function updateGallery(){

 document.getElementById("track").style.transform=
 "translateX(-"+(currentImage*100)+"%)";


 document.querySelectorAll(".dot").forEach((dot,i)=>{
  dot.classList.toggle("active",i===currentImage);
 });

}


function nextImage(){

 if(images.length<2)return;

 currentImage=
 (currentImage+1)%images.length;

 updateGallery();
}


function previousImage(){

 if(images.length<2)return;

 currentImage=
 (currentImage-1+images.length)%images.length;

 updateGallery();
}


/* =========================
   SWIPE
========================= */

let startX=0;
let endX=0;

document.getElementById("gallery").addEventListener(
 "touchstart",
 e=>{
  startX=e.changedTouches[0].screenX;
 },
 {passive:true}
);


document.getElementById("gallery").addEventListener(
 "touchend",
 e=>{

  endX=e.changedTouches[0].screenX;

  const difference=startX-endX;

  if(Math.abs(difference)<40)return;

  if(difference>0){
   nextImage();
  }else{
   previousImage();
  }

 },
 {passive:true}
);


/* =========================
   SIZES
========================= */

function renderSizes(){

 const box=document.getElementById("sizes");

 box.innerHTML="";


 let sizes=[];

 if(selectedProduct?.sizes){

  sizes=String(selectedProduct.sizes)
   .split(",")
   .map(x=>x.trim())
   .filter(Boolean);

 }


 if(!sizes.length){
  sizes=["S","M","L"];
 }


 sizes.forEach(size=>{

  const button=document.createElement("button");

  button.className="size";
  button.textContent=size;

  button.onclick=()=>{

   document.querySelectorAll(".size")
   .forEach(x=>x.classList.remove("selected"));

   button.classList.add("selected");

   selectedSize=size;
  };

  box.appendChild(button);

 });

}


/* =========================
   BAG
========================= */

function addToBag(){

 if(!selectedProduct)return;

 if(!selectedSize){

  alert("Please select a size.");

  return;
 }


 bag.push({

  id:selectedProduct.id,
  name:selectedProduct.name,
  price:Number(selectedProduct.price || 0),
  size:selectedSize

 });


 updateBagCount();

 closeProduct();

 alert("Added to your bag.");
}


function updateBagCount(){

 document.getElementById("bagCount").textContent=
 bag.length;

}


/* =========================
   OPEN BAG
========================= */

function openBag(){

 const box=document.getElementById("bagItems");

 if(!bag.length){

  box.innerHTML="Your bag is empty.";

 }else{

  box.innerHTML="";

  bag.forEach((item,index)=>{

   const row=document.createElement("div");

   row.className="bag-item";

   row.innerHTML=
   "<span>"+
   item.name+
   "<br>Size: "+item.size+
   "</span>"+
   "<span>$"+item.price.toFixed(2)+"</span>";

   box.appendChild(row);

  });

 }

 document.getElementById("bagModal").classList.add("active");
}


function closeBag(){

 document.getElementById("bagModal").classList.remove("active");

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

 if(!bag.length){

  alert("Your bag is empty.");

  return;
 }

 alert(
  "Checkout is the next step. Your products are ready in the bag."
 );

}


/* =========================
   SEARCH
========================= */

function toggleSearch(){

 const box=document.getElementById("searchBox");

 box.classList.toggle("active");

 if(box.classList.contains("active")){

  setTimeout(()=>{
   document.getElementById("searchInput").focus();
  },100);

 }

}


function searchProducts(){

 const value=
 document.getElementById("searchInput")
 .value
 .toLowerCase()
 .trim();


 const filtered=
 products.filter(product=>
  String(product.name || "")
  .toLowerCase()
  .includes(value) ||
  String(product.category || "")
  .toLowerCase()
  .includes(value)
 );


 renderProducts(
  filtered,
  document.getElementById("newProducts")
 );

 renderProducts(
  filtered,
  document.getElementById("shopProducts")
 );

}


/* =========================
   CLOSE MODALS
========================= */

document.getElementById("productModal").onclick=e=>{

 if(e.target===e.currentTarget){
  closeProduct();
 }

};


document.getElementById("bagModal").onclick=e=>{

 if(e.target===e.currentTarget){
  closeBag();
 }

};


document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){

  closeProduct();
  closeBag();

 }

 if(e.key==="ArrowRight")nextImage();

 if(e.key==="ArrowLeft")previousImage();

});


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
